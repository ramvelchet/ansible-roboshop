- name:  create ec2 and r53
  hosts: local
  connection: local
  vars:
    ami_id: ami-09c813fb71547fc4f
    sg_id: sg-09cf9328ecdbbbeec
    zone_id: "Z0877618Q6W0PB02GEO4"
    domain_name: "ramvelcheti.store"
    instances: 
    - mongodb
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
  
  - name: print public_ip
    ansible.builtin.debug: 
       msg: "{{ item.instances[0].public_ip_address }}"
    loop: "{{ ec2_output.results }}"

  -  name: print private_ip
     ansible.builtin.debug: 
        msg: "{{ item.instances[0].private_ip_address }}"
     loop: "{{ ec2_output.results }}"